<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="100%" height="auto" role="img" aria-label="Nkugwa Mark William banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117">
        <animate attributeName="stop-color" values="#0d1117;#1b1035;#0d1117" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#161b22">
        <animate attributeName="stop-color" values="#161b22;#3d1a6b;#161b22" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0d1117">
        <animate attributeName="stop-color" values="#0d1117;#2a1252;#0d1117" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6bcb"/>
      <stop offset="33%" stop-color="#8be9fd"/>
      <stop offset="66%" stop-color="#50fa7b"/>
      <stop offset="100%" stop-color="#ffb86c"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;20 0;0 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6bcb"/>
      <stop offset="100%" stop-color="#8be9fd"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="340" fill="url(#bg)"/>

  <g opacity="0.55">
    <circle cx="120" cy="70" r="46" fill="#ff6bcb" opacity="0.18">
      <animateTransform attributeName="transform" type="translate" values="0 0;14 -18;0 0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="250" r="34" fill="#8be9fd" opacity="0.16">
      <animateTransform attributeName="transform" type="translate" values="0 0;-16 12;0 0" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="60" r="26" fill="#50fa7b" opacity="0.14">
      <animateTransform attributeName="transform" type="translate" values="0 0;10 14;0 0" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="230" r="52" fill="#ffb86c" opacity="0.14">
      <animateTransform attributeName="transform" type="translate" values="0 0;-12 -10;0 0" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="80" r="22" fill="#ff79c6" opacity="0.15">
      <animateTransform attributeName="transform" type="translate" values="0 0;8 12;0 0" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g stroke="#ffffff" stroke-opacity="0.06" fill="none" stroke-width="1.5">
    <path d="M0 300 L180 250 L360 295 L540 245 L720 290 L900 255 L1000 280 L1000 340 L0 340 Z"/>
  </g>

  <text x="500" y="150" text-anchor="middle" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="58" font-weight="800" fill="url(#titleGrad)">
    Nkugwa Mark William
  </text>

  <rect x="370" y="172" width="260" height="5" rx="2.5" fill="url(#line)">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
  </rect>

  <text x="500" y="225" text-anchor="middle" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="26" fill="#c9d1d9" opacity="0.92">
    ⚗️ Chemical &amp; Process Engineer &nbsp;×&nbsp; 💻 Software Engineer
  </text>

  <text x="500" y="268" text-anchor="middle" font-family="'Courier New', monospace" font-size="17" fill="#8be9fd" opacity="0.85">
    &lt; production officer / QCIL · ALX alumnus · Kampala, Uganda /&gt;
  </text>
</svg>
